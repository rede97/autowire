<!doctype html>
<!--
  Connect demo unit "phy_wrap" over the common_cells test material
  (hdxml/tests/projects/common_cells). Exercises: template reuse + overwrite,
  RegExp rewrite with $1 captures, ${idx} variables, width + part slicing on a
  shared bus, packed=auto with §7.4 param width rewrite, module param /
  localparam folding chains, nested aw-submods with sibling deps
  (path-accumulated visible set), before-instances + on-template lifecycle
  hooks. Contract: docs/connect/html.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>phy_wrap</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="phy_wrap">
        <aw-content>
          <aw-imports></aw-imports>
          <aw-params>
            <aw-param name="CNT_W" expr="8"></aw-param>
          </aw-params>
          <aw-localparams>
            <!-- fold chain: GRAY_W → CNT_W → 8 -->
            <aw-localparam name="GRAY_W" expr="CNT_W"></aw-localparam>
          </aw-localparams>
          <aw-ports>
            <aw-port dir="output" name="phy_gray_o" packed="[2*CNT_W-1:0]"></aw-port>
            <aw-port dir="output" name="phy_bin_o"></aw-port>
          </aw-ports>
          <aw-templates>
            <aw-template name="cnt_tpl" inst_name="${id}_${idx}">
              <!-- inherit module param: folds to 8 (connect-rules §7.2) -->
              <aw-param name="Width" expr="CNT_W"></aw-param>
              <aw-connect port="clk_i" to="clk_i"></aw-connect>
              <aw-connect port="rst_ni" to="rst_ni"></aw-connect>
              <aw-rewrite match="^(clr|en|load)_i$" to="cnt_${idx}_$1" packed="auto"></aw-rewrite>
              <!-- shared data buses: explicit width + per-idx part-select -->
              <aw-rewrite
                match="^d_i$"
                to="cnt_d_bus"
                width="15:0"
                part="8*${idx}+7:8*${idx}"
              ></aw-rewrite>
              <aw-rewrite
                match="^q_o$"
                to="cnt_q_bus"
                width="15:0"
                part="8*${idx}+7:8*${idx}"
              ></aw-rewrite>
              <!-- intentional dangling outputs (connect-to-rules §2.3): no PINMISSING -->
              <aw-rewrite match="^overflow_o$" type="open"></aw-rewrite>
            </aw-template>
          </aw-templates>
          <aw-insts>
            <aw-inst id="u_cnt" mod="cc_counter" idx="0">
              <aw-template base="cnt_tpl"></aw-template>
            </aw-inst>
            <aw-inst id="u_cnt" mod="cc_counter" idx="1">
              <!-- overwrite: later rule for en_i wins over the base rewrite -->
              <aw-template base="cnt_tpl">
                <aw-rewrite match="^en_i$" to="cnt_alt_en_${idx}" packed="auto"></aw-rewrite>
              </aw-template>
            </aw-inst>
            <aw-inst id="u_tap" mod="gray_tap">
              <aw-template>
                <aw-connect port="tap_in" to="cnt_q_bus"></aw-connect>
                <aw-connect port="tap_out_o" to="phy_gray_o"></aw-connect>
              </aw-template>
            </aw-inst>
          </aw-insts>
        </aw-content>
        <aw-submods>
          <aw-mod name="gray_pair">
            <aw-content>
              <aw-imports></aw-imports>
              <aw-params>
                <aw-param name="GWIDTH" expr="8"></aw-param>
              </aw-params>
              <aw-localparams></aw-localparams>
              <aw-ports>
                <aw-port dir="input" name="pair_in" packed="[GWIDTH-1:0]"></aw-port>
                <aw-port dir="output" name="pair_out" packed="[GWIDTH-1:0]"></aw-port>
              </aw-ports>
              <aw-templates></aw-templates>
              <aw-insts>
                <aw-inst id="u_b2g" mod="cc_binary_to_gray">
                  <aw-template>
                    <aw-param name="Width" expr="GWIDTH"></aw-param>
                    <aw-connect port="a_i" to="pair_in"></aw-connect>
                    <aw-connect port="z_o" to="pair_mid"></aw-connect>
                  </aw-template>
                </aw-inst>
                <aw-inst id="u_g2b" mod="cc_gray_to_binary">
                  <aw-template>
                    <aw-param name="Width" expr="GWIDTH"></aw-param>
                    <aw-connect port="a_i" to="pair_mid"></aw-connect>
                    <aw-connect port="z_o" to="pair_out"></aw-connect>
                  </aw-template>
                </aw-inst>
              </aw-insts>
            </aw-content>
            <aw-submods></aw-submods>
            <aw-render></aw-render>
          </aw-mod>
          <!-- sibling reference: gray_tap instantiates gray_pair → deps required -->
          <aw-mod name="gray_tap" deps="gray_pair">
            <aw-content>
              <aw-imports></aw-imports>
              <aw-params>
                <aw-param name="TW" expr="16"></aw-param>
              </aw-params>
              <aw-localparams></aw-localparams>
              <aw-ports>
                <aw-port dir="output" name="tap_out_o" packed="[TW-1:0]"></aw-port>
              </aw-ports>
              <aw-templates></aw-templates>
              <aw-insts>
                <!-- wrapper target: GWIDTH override uniquifies into this module -->
                <aw-inst id="u_pair" mod="gray_pair">
                  <aw-template>
                    <aw-param name="GWIDTH" expr="TW"></aw-param>
                    <aw-connect port="pair_in" to="tap_in"></aw-connect>
                    <aw-connect port="pair_out" to="tap_out_o"></aw-connect>
                  </aw-template>
                </aw-inst>
              </aw-insts>
            </aw-content>
            <aw-submods></aw-submods>
            <aw-render></aw-render>
          </aw-mod>
        </aw-submods>
        <aw-render></aw-render>
      </aw-mod>
    </autowire>
    <script type="module">
      // Lifecycle demo (docs/connect/lifecycle.md): two write phases only.
      // before-instances: generate the one-hot decoder instance (not present in
      // the static author face; check stays on the static content).
      aw.on("before-instances", ({ mod }) => {
        if (mod.getAttribute("name") !== "phy_wrap") return;
        const insts = mod.querySelector(":scope > aw-content > aw-insts");
        const doc = mod.ownerDocument;
        const inst = doc.createElement("aw-inst");
        inst.setAttribute("id", "u_oh2b");
        inst.setAttribute("mod", "cc_onehot_to_bin");
        const tpl = doc.createElement("aw-template");
        const param = doc.createElement("aw-param");
        param.setAttribute("name", "OnehotWidth");
        param.setAttribute("expr", "GRAY_W"); // internal localparam chain → folds to 8
        tpl.appendChild(param);
        const c1 = doc.createElement("aw-connect");
        c1.setAttribute("port", "onehot_i");
        c1.setAttribute("to", "oh_onehot");
        tpl.appendChild(c1);
        const c2 = doc.createElement("aw-connect");
        c2.setAttribute("port", "bin_o");
        c2.setAttribute("to", "phy_bin_o");
        tpl.appendChild(c2);
        inst.appendChild(tpl);
        insts.appendChild(inst);
      });
      // on-template: counters share a down_i net; edited on the intermediate
      // connect list before the engine commits to aw-render.
      aw.on("on-template", ({ mod, inst, connects }) => {
        if (mod.getAttribute("name") !== "phy_wrap") return;
        if (inst.getAttribute("id") !== "u_cnt") return;
        connects.push({
          port: "down_i",
          to: "cnt_shared_down",
          packed: null,
          width: null,
          unpacked: null,
          part: null,
          nettype: null,
        });
      });
    </script>
  </body>
</html>
