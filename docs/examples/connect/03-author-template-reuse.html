<!doctype html>
<!--
  作者面：match+to 复用 / overwrite；packed=auto 与共享 bus + part 切片。
  对应渲染：03-rendered-template-reuse.html
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>03-author-template-reuse</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="lane_wrap">
        <aw-content>
          <aw-params>
            <aw-param name="N" expr="2"></aw-param>
          </aw-params>
          <aw-ports></aw-ports>
          <aw-templates>
            <aw-template name="lane_tpl" inst_name="${id}${idx}">
              <!-- 先通配，再精确覆盖（后写覆盖） -->
              <aw-rewrite match="^(.+)$" to="lane_$1" packed="auto"></aw-rewrite>
              <aw-rewrite match="^clk$" to="lane_clk" packed="auto"></aw-rewrite>
              <aw-rewrite
                match="^data$"
                to="lane_data_bus"
                width="15:0"
                part="8*${idx}+7:8*${idx}"
              ></aw-rewrite>
            </aw-template>
          </aw-templates>
          <aw-insts>
            <aw-inst id="u_lane" mod="lane_slice" idx="0">
              <aw-template base="lane_tpl"></aw-template>
            </aw-inst>
            <aw-inst id="u_lane" mod="lane_slice" idx="1">
              <aw-template base="lane_tpl">
                <aw-connect port="dbg" to="lane_1_dbg" packed="auto"></aw-connect>
              </aw-template>
            </aw-inst>
          </aw-insts>
        </aw-content>
        <aw-submods></aw-submods>
        <aw-render>
          <aw-params></aw-params>
          <aw-localparams></aw-localparams>
          <aw-ports></aw-ports>
          <aw-signals></aw-signals>
          <aw-insts></aw-insts>
        </aw-render>
      </aw-mod>
    </autowire>
  </body>
</html>
