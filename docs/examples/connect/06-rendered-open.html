<!doctype html>
<!--
  渲染后示意：对应 06-author-open（引擎实际产物，非作者 SoT）。
  open 不建网（aw-signals 无 dbg_*_o）；type="open" 留在 render 供 dump 打印 .port()；
  u_core_1 的 dbg_aux_o 被后写覆盖回挂网 dbg_aux_1。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>06-rendered-open</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="dbg_wrap">
        <aw-content></aw-content>
        <aw-submods></aw-submods>
        <aw-render>
          <aw-params></aw-params>
          <aw-imports></aw-imports>
          <aw-localparams></aw-localparams>
          <aw-ports>
            <aw-port name="clk" dir="input" nettype="logic"></aw-port>
          </aw-ports>
          <aw-signals>
            <aw-signal name="clk" nettype="logic"></aw-signal>
            <aw-signal name="stat_0" packed="[1:0]" nettype="logic"></aw-signal>
            <aw-signal name="dbg_aux_1" packed="[3:0]" nettype="logic"></aw-signal>
            <aw-signal name="stat_1" packed="[1:0]" nettype="logic"></aw-signal>
          </aw-signals>
          <aw-insts>
            <aw-inst id="u_core_0" mod="dbg_core">
              <aw-connect port="clk" to="clk"></aw-connect>
              <aw-connect port="dbg_main_o" type="open"></aw-connect>
              <aw-connect port="dbg_aux_o" type="open"></aw-connect>
              <aw-connect port="stat_o" to="stat_0"></aw-connect>
            </aw-inst>
            <aw-inst id="u_core_1" mod="dbg_core">
              <aw-connect port="clk" to="clk"></aw-connect>
              <aw-connect port="dbg_main_o" type="open"></aw-connect>
              <aw-connect port="dbg_aux_o" to="dbg_aux_1"></aw-connect>
              <aw-connect port="stat_o" to="stat_1"></aw-connect>
            </aw-inst>
          </aw-insts>
        </aw-render>
      </aw-mod>
    </autowire>
  </body>
</html>
