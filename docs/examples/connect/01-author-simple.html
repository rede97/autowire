<!doctype html>
<!--
  作者面：aw-mod 骨架（content 内含 / submods 依赖 / render 生成物）。
  aw-template 类 style：定义一次、多实例 base 引用，可 patch。
  约束：docs/connect-html.md
  对应渲染示意：01-rendered-simple.html
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>01-author-simple</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="master_cfg_wrap">
        <aw-content>
          <!-- 内含关系，不是依赖关系 -->
          <aw-params>
            <aw-param name="BUS_PIPE_NUM" expr="2"></aw-param>
          </aw-params>
          <aw-ports>
            <!-- 明确需要导出的端口，不仅仅是内部链接 -->
            <aw-port dir="output" name="export_share_clk"></aw-port>
          </aw-ports>
          <aw-templates>
            <!-- 通用连接规则（类 style） -->
            <aw-template name="slice_template" inst_name_expr="${id}_${idx}">
              <aw-param name="SLICE_IDX" expr="$idx"></aw-param>
              <aw-connect port="dec_clk" to="dfi_clk"></aw-connect>
              <aw-rewrite port="slice_en" to="slice_en[${idx}]"></aw-rewrite>
              <aw-rewrite port="slice_out_(.*)" to="slice_${idx}_out_$1[]"></aw-rewrite>
            </aw-template>
          </aw-templates>
          <aw-insts>
            <!-- 引用子模块，不在此定义子模体 -->
            <aw-inst id="u_decoder" mod="master_decoder">
              <aw-param name="PIPE_NUM" expr="BUS_PIPE_NUM"></aw-param>
              <aw-connect port="dec_clk" to="dfi_clk"></aw-connect>
              <aw-rewrite port="dec_in_(.*)" to="mst_blk_reg_$1[]"></aw-rewrite>
            </aw-inst>

            <aw-inst id="u_slice" mod="test_slice" idx="0">
              <aw-template base="slice_template"></aw-template>
            </aw-inst>
            <aw-inst id="u_slice" mod="test_slice" idx="1">
              <aw-template base="slice_template"></aw-template>
              <!-- patch：覆盖/追加 -->
              <aw-connect port="slice_dbg" to="slice_1_dbg"></aw-connect>
            </aw-inst>
          </aw-insts>
        </aw-content>
        <aw-submods>
          <!-- 嵌套子模块：依赖关系，递归渲染 -->
        </aw-submods>
        <aw-render>
          <!-- elaboration 写入；dump 读这里。作者勿手填当 SoT -->
          <aw-params></aw-params>
          <aw-ports></aw-ports>
          <aw-signals></aw-signals>
          <aw-insts></aw-insts>
        </aw-render>
      </aw-mod>
    </autowire>
  </body>
</html>
