<!doctype html>
<!--
  渲染后示意：模板已展开为 u_lane0 / u_lane1；无 aw-rewrite。
  禁止当作者 SoT。约束：docs/connect-html.md §4
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>03-rendered-template-clone</title>
  </head>
  <body>
    <aw-mod name="lane_wrap">
      <aw-param name="N" value="2"></aw-param>

      <aw-port name="lane_clk" dir="input"></aw-port>
      <aw-port name="lane_data" dir="inout" width="16"></aw-port>

      <aw-inst id="u_lane0" mod="lane_slice">
        <aw-connect port="clk" to="lane_clk"></aw-connect>
        <aw-connect port="data" to="lane_data"></aw-connect>
      </aw-inst>

      <aw-inst id="u_lane1" mod="lane_slice">
        <aw-connect port="clk" to="lane_clk"></aw-connect>
        <aw-connect port="data" to="lane_data"></aw-connect>
      </aw-inst>
    </aw-mod>
  </body>
</html>
