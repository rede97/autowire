<!doctype html>
<!--
  作者面：嵌套 aw-mod 表达层次；路径 top/blk_a/u0 与 top/u_b。
  约束：docs/connect-html.md §3.1
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>02-author-nested</title>
  </head>
  <body>
    <aw-mod name="top">
      <aw-mod name="blk_a">
        <aw-inst id="u0" mod="leaf_x">
          <aw-connect port="clk" to="clk"></aw-connect>
          <aw-connect port="data_i" to="a_data"></aw-connect>
        </aw-inst>
      </aw-mod>

      <aw-inst id="u_b" mod="leaf_y">
        <aw-connect port="clk" to="clk"></aw-connect>
        <aw-connect port="data_i" to="b_data"></aw-connect>
      </aw-inst>
    </aw-mod>
  </body>
</html>
