name: release

# Checks, builds, and the GitHub Release run only for a pushed v* tag.
# A push to main does not start this workflow. CI never creates tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - run: bun scripts/check-version.ts
      - run: bun run lint
      # hdxml is its own project (rede97/hdxml): no cargo here, just the pinned binary.
      - run: bun scripts/fetch-hdxml.ts
      - run: bun ../../index.ts analysis run
        working-directory: demo/soc
      - run: bunx playwright install chromium --with-deps
      - run: bun test

  autowire-js:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:js
      - run: bun out/autowire.js --version
      # Drive the shipped bundle end to end (demo/soc via the packaged CLI);
      # catches bundle-only breakage unit tests against src/ never see.
      - run: bun scripts/fetch-hdxml.ts
      - run: bun scripts/smoke-bundle.ts
      - uses: actions/upload-artifact@v4
        with:
          name: autowire-js
          path: out/autowire.js
          if-no-files-found: error

  hdxml-assets:
    # hdxml is its own project (rede97/hdxml) with its own release cadence.
    # Pin a version in hdxml-version.txt and copy that release's binaries.
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: download the pinned hdxml release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < hdxml-version.txt)"
          mkdir -p hdxml-assets
          gh release download "v$VERSION" --repo rede97/hdxml \
            --pattern 'hdxml-*' --dir hdxml-assets --clobber
          ls -l hdxml-assets
          mkdir -p /tmp/hdxml-check
          tar -xJf hdxml-assets/hdxml-linux-x64.tar.xz -C /tmp/hdxml-check
          /tmp/hdxml-check/hdxml --version
      - uses: actions/upload-artifact@v4
        with:
          name: hdxml-assets
          path: hdxml-assets/*
          if-no-files-found: error

  publish:
    # Only a tag push publishes — tags are created and pushed by the user,
    # never by CI (no moving or recreating tags, no republishing).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [autowire-js, hdxml-assets]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release-notes.ts /tmp/notes.md
      - id: meta
        run: |
          VERSION="$(bun scripts/release-notes.ts)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          ls -R artifacts
          cp artifacts/autowire-js/autowire.js .
          cp artifacts/hdxml-assets/*.tar.xz .
          cp artifacts/hdxml-assets/*.zip .
      - name: verify pushed tag matches the changelog top
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          test "$GITHUB_REF_NAME" = "$TAG" || {
            echo "pushed tag $GITHUB_REF_NAME != changelog top $TAG"; exit 1;
          }
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "release $TAG already exists; refusing to republish"; exit 1;
          }
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            autowire.js hdxml-linux-x64.tar.xz hdxml-macos-arm64.tar.xz hdxml-macos-x64.tar.xz hdxml-windows-x64.zip
