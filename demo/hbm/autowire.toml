# autowire workspace: HBM-style two-level Wishbone fabric (bus generator only).
# No hand-written RTL and no connect HTML — this demo exercises the bus plugin:
#   level 1  hbm      interconnect: cfg (WB, fabric clk) + host (APB via
#                     wb_apb2wb + wb_cdc); produces the pstate tag from ADR[18:17];
#                     center CSR at 0x00000, channel i at (i + 1) * 0x1000
#   level 2  hbm_ch   aword + dword0 + dword1; passes the tag through
# Run from this directory: bun ../../index.ts plugin wishbone run
# VCS + UVM-1.2 regression (agents/RAL in dv/uvm): sim/vcs/run.sh

[dump]
plugins_dir = "rtl/gen/plugins"

# Packed software exports (not SoT); regfile/ and bus/ stay separate
[plugins.wishbone]
c = "fw/gen/wishbone"
export = "fw/gen/wishbone/bus_regfiles.xlsx"
uvm = "dv/ral"

# Author SoT
[wishbone.aword]
ts = "sot/wb_reg_aword.ts"

[wishbone.center]
ts = "sot/wb_reg_center.ts"

[wishbone.dword]
ts = "sot/wb_reg_dword.ts"

[wishbone.hbm]
ts = "sot/wb_bus_hbm.ts"
