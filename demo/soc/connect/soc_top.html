<!doctype html>
<!--
  Connect unit "soc_top": small demo SoC after picosoc.
    picorv32 (picorv32_wb, Wishbone master) + SRAM + spimemio XIP flash +
    simpleuart + test output + 2x sdspi (SPI SD card) + 2x sd_rd_dma
    (Wishbone master -> AXI4-Stream) + 2x sha256wb (cross-unit, deps).
  Buses: Wishbone B4 classic (flat-vector interconnect, per-slot part
  selects) + AXI4-Stream (DMA -> sha256 lanes).
  Memory map (byte addresses):
    0x0000_0000  SRAM        64 KiB          slot 0
    0x0100_0000  FLASH XIP   16 MiB          slot 1
    0x0200_0000  FLASH CFG   4 B             slot 2
    0x0200_0004  UART        8 B (div, dat)  slot 3
    0x0200_0010  TESTOUT     4 B             slot 4
    0x0300_0000  SD0         16 B            slot 5
    0x0300_1000  SD1         16 B            slot 6
    0x0300_2000  DMA0        16 B            slot 7
    0x0300_3000  DMA1        16 B            slot 8
    0x0300_4000  SHA256_0    64 B            slot 9
    0x0300_5000  SHA256_1    64 B            slot 10
  Masters: m0 = CPU, m1 = DMA0, m2 = DMA1 (instance idx = master slot;
  peripheral instances use idx = slave slot; lane numbering is literal).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>soc_top</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="soc_top">
        <aw-content>
          <aw-imports></aw-imports>
          <aw-params></aw-params>
          <aw-localparams></aw-localparams>
          <aw-ports>
            <aw-port dir="input" name="clk"></aw-port>
            <aw-port dir="input" name="rst_ni"></aw-port>
            <aw-port dir="output" name="trap"></aw-port>
            <!-- UART -->
            <aw-port dir="output" name="ser_tx"></aw-port>
            <aw-port dir="input" name="ser_rx"></aw-port>
            <!-- QSPI flash -->
            <aw-port dir="output" name="flash_csb"></aw-port>
            <aw-port dir="output" name="flash_clk"></aw-port>
            <aw-port dir="output" name="flash_io0_oe"></aw-port>
            <aw-port dir="output" name="flash_io1_oe"></aw-port>
            <aw-port dir="output" name="flash_io2_oe"></aw-port>
            <aw-port dir="output" name="flash_io3_oe"></aw-port>
            <aw-port dir="output" name="flash_io0_do"></aw-port>
            <aw-port dir="output" name="flash_io1_do"></aw-port>
            <aw-port dir="output" name="flash_io2_do"></aw-port>
            <aw-port dir="output" name="flash_io3_do"></aw-port>
            <aw-port dir="input" name="flash_io0_di"></aw-port>
            <aw-port dir="input" name="flash_io1_di"></aw-port>
            <aw-port dir="input" name="flash_io2_di"></aw-port>
            <aw-port dir="input" name="flash_io3_di"></aw-port>
            <!-- SD card 0 (SPI mode) -->
            <aw-port dir="output" name="sd0_cs_n"></aw-port>
            <aw-port dir="output" name="sd0_sck"></aw-port>
            <aw-port dir="output" name="sd0_mosi"></aw-port>
            <aw-port dir="input" name="sd0_miso"></aw-port>
            <aw-port dir="input" name="sd0_cd"></aw-port>
            <!-- SD card 1 (SPI mode) -->
            <aw-port dir="output" name="sd1_cs_n"></aw-port>
            <aw-port dir="output" name="sd1_sck"></aw-port>
            <aw-port dir="output" name="sd1_mosi"></aw-port>
            <aw-port dir="input" name="sd1_miso"></aw-port>
            <aw-port dir="input" name="sd1_cd"></aw-port>
            <!-- built-in test output -->
            <aw-port dir="output" name="test_valid"></aw-port>
            <aw-port dir="output" name="test_data" packed="[31:0]"></aw-port>
          </aw-ports>
          <aw-templates>
            <!-- Wishbone master slice: idx = master slot (m0 cpu, m1/m2 dma) -->
            <aw-template name="wb_mst" inst_name="${id}_${idx}">
              <aw-rewrite match="^wbm_cyc_o$" to="ic_m_cyc" width="2:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_stb_o$" to="ic_m_stb" width="2:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_we_o$" to="ic_m_we" width="2:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_ack_i$" to="ic_m_ack" width="2:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_adr_o$" to="ic_m_adr" width="95:0" part="32*${idx}+31:32*${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_dat_o$" to="ic_m_wdata" width="95:0" part="32*${idx}+31:32*${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_dat_i$" to="ic_m_rdata" width="95:0" part="32*${idx}+31:32*${idx}"></aw-rewrite>
              <aw-rewrite match="^wbm_sel_o$" to="ic_m_sel" width="11:0" part="4*${idx}+3:4*${idx}"></aw-rewrite>
            </aw-template>
            <!-- Wishbone slave slice: idx = slave slot (0..10) -->
            <aw-template name="wb_slv" inst_name="${id}_${idx}">
              <aw-rewrite match="^clk$" to="clk"></aw-rewrite>
              <aw-rewrite match="^rst_n$" to="rst_ni"></aw-rewrite>
              <aw-rewrite match="^i_wb_cyc$" to="ic_s_cyc" width="10:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^i_wb_stb$" to="ic_s_stb" width="10:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^i_wb_we$" to="ic_s_we" width="10:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^o_wb_ack$" to="ic_s_ack" width="10:0" part="${idx}"></aw-rewrite>
              <aw-rewrite match="^i_wb_addr$" to="ic_s_adr" width="351:0" part="32*${idx}+31:32*${idx}"></aw-rewrite>
              <aw-rewrite match="^i_wb_data$" to="ic_s_wdata" width="351:0" part="32*${idx}+31:32*${idx}"></aw-rewrite>
              <aw-rewrite match="^o_wb_data$" to="ic_s_rdata" width="351:0" part="32*${idx}+31:32*${idx}"></aw-rewrite>
              <aw-rewrite match="^i_wb_sel$" to="ic_s_sel" width="43:0" part="4*${idx}+3:4*${idx}"></aw-rewrite>
            </aw-template>
          </aw-templates>
          <aw-insts>
            <!-- active-low resetn -> active-high rst for picorv32_wb / sdspi -->
            <aw-inst id="u_rst" mod="soc_reset">
              <aw-template>
                <aw-connect port="clk" to="clk"></aw-connect>
                <aw-connect port="i_rst_n" to="rst_ni"></aw-connect>
                <aw-connect port="o_rst" to="rst"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- CPU: picorv32 with Wishbone master (master slot 0) -->
            <aw-inst id="u_cpu" mod="picorv32_wb" idx="0">
              <aw-template base="wb_mst">
                <aw-param name="BARREL_SHIFTER" expr="1"></aw-param>
                <aw-param name="COMPRESSED_ISA" expr="1"></aw-param>
                <aw-param name="ENABLE_MUL" expr="1"></aw-param>
                <aw-param name="ENABLE_DIV" expr="1"></aw-param>
                <aw-param name="ENABLE_IRQ" expr="1"></aw-param>
                <aw-param name="ENABLE_IRQ_QREGS" expr="0"></aw-param>
                <aw-param name="LATCHED_IRQ" expr="32'h00000000"></aw-param>
                <aw-param name="PROGADDR_RESET" expr="32'h01000000"></aw-param>
                <aw-param name="PROGADDR_IRQ" expr="32'h00000000"></aw-param>
                <aw-param name="STACKADDR" expr="32'h00010000"></aw-param>
                <aw-connect port="wb_clk_i" to="clk"></aw-connect>
                <aw-connect port="wb_rst_i" to="rst"></aw-connect>
                <aw-connect port="irq" to="irq_bus" width="31:0"></aw-connect>
                <aw-connect port="eoi" type="open"></aw-connect>
                <aw-connect port="trap" to="trap"></aw-connect>
                <aw-connect port="pcpi_valid" type="open"></aw-connect>
                <aw-connect port="pcpi_insn" type="open"></aw-connect>
                <aw-connect port="pcpi_rs1" type="open"></aw-connect>
                <aw-connect port="pcpi_rs2" type="open"></aw-connect>
                <aw-connect port="pcpi_wr" to="1'b0" type="const"></aw-connect>
                <aw-connect port="pcpi_rd" to="32'h00000000" type="const"></aw-connect>
                <aw-connect port="pcpi_wait" to="1'b0" type="const"></aw-connect>
                <aw-connect port="pcpi_ready" to="1'b0" type="const"></aw-connect>
                <aw-connect port="trace_valid" type="open"></aw-connect>
                <aw-connect port="trace_data" type="open"></aw-connect>
                <aw-connect port="mem_instr" type="open"></aw-connect>
              </aw-template>
            </aw-inst>
            <!-- flat-vector interconnect: 3 masters x 11 slaves -->
            <aw-inst id="u_ic" mod="wb_interconnect">
              <aw-template>
                <aw-param name="NM" expr="3"></aw-param>
                <aw-param name="NS" expr="11"></aw-param>
                <!-- slot0 = LSBs: sram, flash, cfg, uart, testout, sd0, sd1, dma0, dma1, sha0, sha1 -->
                <aw-param name="SLAVE_BASE" expr="{32'h03005000, 32'h03004000, 32'h03003000, 32'h03002000, 32'h03001000, 32'h03000000, 32'h02000010, 32'h02000004, 32'h02000000, 32'h01000000, 32'h00000000}"></aw-param>
                <aw-param name="SLAVE_MASK" expr="{32'hffffffc0, 32'hffffffc0, 32'hfffffff0, 32'hfffffff0, 32'hfffffff0, 32'hfffffff0, 32'hfffffffc, 32'hfffffff8, 32'hfffffffc, 32'hff000000, 32'hffff0000}"></aw-param>
                <aw-connect port="clk" to="clk"></aw-connect>
                <aw-connect port="rst_n" to="rst_ni"></aw-connect>
                <aw-connect port="m_adr_i" to="ic_m_adr" width="95:0"></aw-connect>
                <aw-connect port="m_dat_i" to="ic_m_wdata" width="95:0"></aw-connect>
                <aw-connect port="m_sel_i" to="ic_m_sel" width="11:0"></aw-connect>
                <aw-connect port="m_cyc_i" to="ic_m_cyc" width="2:0"></aw-connect>
                <aw-connect port="m_stb_i" to="ic_m_stb" width="2:0"></aw-connect>
                <aw-connect port="m_we_i" to="ic_m_we" width="2:0"></aw-connect>
                <aw-connect port="m_dat_o" to="ic_m_rdata" width="95:0"></aw-connect>
                <aw-connect port="m_ack_o" to="ic_m_ack" width="2:0"></aw-connect>
                <aw-connect port="s_adr_o" to="ic_s_adr" width="351:0"></aw-connect>
                <aw-connect port="s_dat_o" to="ic_s_wdata" width="351:0"></aw-connect>
                <aw-connect port="s_sel_o" to="ic_s_sel" width="43:0"></aw-connect>
                <aw-connect port="s_cyc_o" to="ic_s_cyc" width="10:0"></aw-connect>
                <aw-connect port="s_stb_o" to="ic_s_stb" width="10:0"></aw-connect>
                <aw-connect port="s_we_o" to="ic_s_we" width="10:0"></aw-connect>
                <aw-connect port="s_dat_i" to="ic_s_rdata" width="351:0"></aw-connect>
                <aw-connect port="s_ack_i" to="ic_s_ack" width="10:0"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- slot 0: 64 KiB SRAM -->
            <aw-inst id="u_ram" mod="wb_sram" idx="0">
              <aw-template base="wb_slv">
                <aw-param name="WORDS" expr="16384"></aw-param>
                <aw-param name="AW" expr="14"></aw-param>
              </aw-template>
            </aw-inst>

            <!-- slot 1: flash XIP window; slot 2: flash cfgreg (overwrite) -->
            <aw-inst id="u_flash" mod="wb_spiflash" idx="1">
              <aw-template base="wb_slv">
                <aw-connect port="i_cfg_cyc" to="ic_s_cyc" width="10:0" part="2"></aw-connect>
                <aw-connect port="i_cfg_stb" to="ic_s_stb" width="10:0" part="2"></aw-connect>
                <aw-connect port="i_cfg_we" to="ic_s_we" width="10:0" part="2"></aw-connect>
                <aw-connect port="o_cfg_ack" to="ic_s_ack" width="10:0" part="2"></aw-connect>
                <aw-connect port="i_cfg_addr" to="ic_s_adr" width="351:0" part="95:64"></aw-connect>
                <aw-connect port="i_cfg_data" to="ic_s_wdata" width="351:0" part="95:64"></aw-connect>
                <aw-connect port="o_cfg_data" to="ic_s_rdata" width="351:0" part="95:64"></aw-connect>
                <aw-connect port="i_cfg_sel" to="ic_s_sel" width="43:0" part="11:8"></aw-connect>
                <aw-rewrite match="^flash_io(\d)_oe$" to="flash_io$1_oe"></aw-rewrite>
                <aw-rewrite match="^flash_io(\d)_do$" to="flash_io$1_do"></aw-rewrite>
                <aw-rewrite match="^flash_io(\d)_di$" to="flash_io$1_di"></aw-rewrite>
                <aw-connect port="flash_csb" to="flash_csb"></aw-connect>
                <aw-connect port="flash_clk" to="flash_clk"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- slot 3: UART -->
            <aw-inst id="u_uart" mod="wb_uart" idx="3">
              <aw-template base="wb_slv">
                <aw-connect port="ser_tx" to="ser_tx"></aw-connect>
                <aw-connect port="ser_rx" to="ser_rx"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- slot 4: built-in test output -->
            <aw-inst id="u_testout" mod="wb_testout" idx="4">
              <aw-template base="wb_slv">
                <aw-connect port="o_test_valid" to="test_valid"></aw-connect>
                <aw-connect port="o_test_data" to="test_data" packed="auto"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- slots 5/6: SD card controllers (2-bit word address overwrite) -->
            <aw-inst id="u_sd" mod="sdspi" idx="5">
              <aw-template base="wb_slv">
                <aw-rewrite match="^i_wb_addr$" to="ic_s_adr" width="351:0" part="32*${idx}+3:32*${idx}+2"></aw-rewrite>
                <aw-connect port="i_clk" to="clk"></aw-connect>
                <aw-connect port="i_sd_reset" to="rst"></aw-connect>
                <aw-connect port="o_wb_stall" type="open"></aw-connect>
                <aw-connect port="i_bus_grant" to="1'b1" type="const"></aw-connect>
                <aw-connect port="o_cs_n" to="sd0_cs_n"></aw-connect>
                <aw-connect port="o_sck" to="sd0_sck"></aw-connect>
                <aw-connect port="o_mosi" to="sd0_mosi"></aw-connect>
                <aw-connect port="i_miso" to="sd0_miso"></aw-connect>
                <aw-connect port="i_card_detect" to="sd0_cd"></aw-connect>
                <aw-connect port="o_int" to="irq_srcs" width="5:0" part="${idx}-5"></aw-connect>
              </aw-template>
            </aw-inst>
            <aw-inst id="u_sd" mod="sdspi" idx="6">
              <aw-template base="wb_slv">
                <aw-rewrite match="^i_wb_addr$" to="ic_s_adr" width="351:0" part="32*${idx}+3:32*${idx}+2"></aw-rewrite>
                <aw-connect port="i_clk" to="clk"></aw-connect>
                <aw-connect port="i_sd_reset" to="rst"></aw-connect>
                <aw-connect port="o_wb_stall" type="open"></aw-connect>
                <aw-connect port="i_bus_grant" to="1'b1" type="const"></aw-connect>
                <aw-connect port="o_cs_n" to="sd1_cs_n"></aw-connect>
                <aw-connect port="o_sck" to="sd1_sck"></aw-connect>
                <aw-connect port="o_mosi" to="sd1_mosi"></aw-connect>
                <aw-connect port="i_miso" to="sd1_miso"></aw-connect>
                <aw-connect port="i_card_detect" to="sd1_cd"></aw-connect>
                <aw-connect port="o_int" to="irq_srcs" width="5:0" part="${idx}-5"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- master slots 1/2 + slave slots 7/8: SD read DMAs -->
            <aw-inst id="u_dma" mod="sd_rd_dma" idx="1">
              <aw-template base="wb_mst"></aw-template>
              <aw-template>
                <aw-connect port="clk" to="clk"></aw-connect>
                <aw-connect port="rst_n" to="rst_ni"></aw-connect>
                <aw-connect port="i_wb_cyc" to="ic_s_cyc" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="i_wb_stb" to="ic_s_stb" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="i_wb_we" to="ic_s_we" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="o_wb_ack" to="ic_s_ack" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="i_wb_addr" to="ic_s_adr" width="351:0" part="32*${idx}+223:32*${idx}+192"></aw-connect>
                <aw-connect port="i_wb_data" to="ic_s_wdata" width="351:0" part="32*${idx}+223:32*${idx}+192"></aw-connect>
                <aw-connect port="o_wb_data" to="ic_s_rdata" width="351:0" part="32*${idx}+223:32*${idx}+192"></aw-connect>
                <aw-connect port="i_wb_sel" to="ic_s_sel" width="43:0" part="4*${idx}+27:4*${idx}+24"></aw-connect>
                <aw-connect port="o_irq" to="irq_srcs" width="5:0" part="${idx}+1"></aw-connect>
                <aw-connect port="m_axis_tdata" to="axs0_tdata" width="31:0"></aw-connect>
                <aw-connect port="m_axis_tvalid" to="axs0_tvalid"></aw-connect>
                <aw-connect port="m_axis_tready" to="axs0_tready"></aw-connect>
                <aw-connect port="m_axis_tlast" to="axs0_tlast"></aw-connect>
              </aw-template>
            </aw-inst>
            <aw-inst id="u_dma" mod="sd_rd_dma" idx="2">
              <aw-template base="wb_mst"></aw-template>
              <aw-template>
                <aw-connect port="clk" to="clk"></aw-connect>
                <aw-connect port="rst_n" to="rst_ni"></aw-connect>
                <aw-connect port="i_wb_cyc" to="ic_s_cyc" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="i_wb_stb" to="ic_s_stb" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="i_wb_we" to="ic_s_we" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="o_wb_ack" to="ic_s_ack" width="10:0" part="${idx}+6"></aw-connect>
                <aw-connect port="i_wb_addr" to="ic_s_adr" width="351:0" part="32*${idx}+223:32*${idx}+192"></aw-connect>
                <aw-connect port="i_wb_data" to="ic_s_wdata" width="351:0" part="32*${idx}+223:32*${idx}+192"></aw-connect>
                <aw-connect port="o_wb_data" to="ic_s_rdata" width="351:0" part="32*${idx}+223:32*${idx}+192"></aw-connect>
                <aw-connect port="i_wb_sel" to="ic_s_sel" width="43:0" part="4*${idx}+27:4*${idx}+24"></aw-connect>
                <aw-connect port="o_irq" to="irq_srcs" width="5:0" part="${idx}+1"></aw-connect>
                <aw-connect port="m_axis_tdata" to="axs1_tdata" width="31:0"></aw-connect>
                <aw-connect port="m_axis_tvalid" to="axs1_tvalid"></aw-connect>
                <aw-connect port="m_axis_tready" to="axs1_tready"></aw-connect>
                <aw-connect port="m_axis_tlast" to="axs1_tlast"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- slots 9/10: sha256 lanes (cross-unit wrapper from sha256wb) -->
            <aw-inst id="u_sha" mod="sha256wb" idx="9">
              <aw-template base="wb_slv">
                <aw-connect port="rst_ni" to="rst_ni"></aw-connect>
                <aw-connect port="s_axis_tdata" to="axs0_tdata" width="31:0"></aw-connect>
                <aw-connect port="s_axis_tvalid" to="axs0_tvalid"></aw-connect>
                <aw-connect port="s_axis_tready" to="axs0_tready"></aw-connect>
                <aw-connect port="s_axis_tlast" to="axs0_tlast"></aw-connect>
                <aw-connect port="irq_o" to="irq_srcs" width="5:0" part="${idx}-5"></aw-connect>
              </aw-template>
            </aw-inst>
            <aw-inst id="u_sha" mod="sha256wb" idx="10">
              <aw-template base="wb_slv">
                <aw-connect port="rst_ni" to="rst_ni"></aw-connect>
                <aw-connect port="s_axis_tdata" to="axs1_tdata" width="31:0"></aw-connect>
                <aw-connect port="s_axis_tvalid" to="axs1_tvalid"></aw-connect>
                <aw-connect port="s_axis_tready" to="axs1_tready"></aw-connect>
                <aw-connect port="s_axis_tlast" to="axs1_tlast"></aw-connect>
                <aw-connect port="irq_o" to="irq_srcs" width="5:0" part="${idx}-5"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- interrupt merge: irq_srcs[5:0] -> irq_bus[31:0] at bits 5..10 -->
            <aw-inst id="u_irq" mod="soc_irqmerge">
              <aw-template>
                <aw-connect port="i_ints" to="irq_srcs" width="5:0"></aw-connect>
                <aw-connect port="o_irq" to="irq_bus" width="31:0"></aw-connect>
              </aw-template>
            </aw-inst>
          </aw-insts>
        </aw-content>
        <aw-submods></aw-submods>
        <aw-render></aw-render>
      </aw-mod>
    </autowire>
  </body>
</html>
