<!doctype html>
<!--
  Connect unit "soc_top": small demo SoC after picosoc.
    picorv32 (picorv32_wb, Wishbone master) + SRAM + spimemio XIP flash +
    simpleuart + test output + 2× sd_sha_ch (SD + DMA + SHA256 channel) +
    smoke_wb glue. Attached smoke_regfile lives inside soc_wb_system;
    sha256_regfile lives inside each channel's sd_sha_system.
  Top fabric is a CPU + JTAG interconnect cascaded into two channel
  interconnects (one sd_sha BusDef, two SlaveBus hangs). Channel DMA cannot
  reach SRAM/flash.
  TGA: ADR[28:27] selects the accessed bank. BANKSEL drives i_bank_mux_sel,
  which picks the working copy of rg_cfg. The muxed rg_cfg loops back to ro_value.
  Arbiters (top + channels): rb_grant_en = smoke rg_rb_grant_en (FABRIC @ 0x030, reset 0).
  JTAG: jtag_* pins → u_tap (demo_tap, DFT placeholder TAP) → USER IR selects
  the dbg TDR inside soc_wb_system (wb_jtag_tdr + wb_cdc); dbg_en tied 1.
  Memory map (byte addresses) / slave id (aw-inst id):
    0x0000_0000  sram
    0x0100_0000  flash_xip
    0x0200_0000  flash_cfg (cfg side of wb_spiflash)
    0x0200_0004  uart
    0x0200_0010  testout
    0x0300_0000  ch0  (sd 0x00 / dma 0x10 / sha256 0x40 relative)
    0x0300_1000  ch1  (same relative map)
    0x0300_6000  smoke
  Masters: CPU + dbg (JTAG). Each channel adds local engine master "eng".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>soc_top</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="soc_top">
        <aw-content>
          <aw-imports></aw-imports>
          <aw-params></aw-params>
          <aw-localparams></aw-localparams>
          <aw-ports></aw-ports>
          <aw-templates>
            <aw-template name="wb_mst" inst_name="${id}_${idx}">
              <aw-rewrite match="^wbm_(.+)_o$" to="${id}_o_wb_$1"></aw-rewrite>
              <aw-rewrite match="^wbm_(.+)_i$" to="${id}_i_wb_$1"></aw-rewrite>
            </aw-template>
            <aw-template name="wb_slv" inst_name="u_${id}">
              <aw-rewrite match="^rst_n$" to="rst_ni"></aw-rewrite>
              <aw-rewrite match="^([io]_wb_.+)$" to="${id}_$1"></aw-rewrite>
            </aw-template>
            <aw-template name="ch" inst_name="u_${id}">
              <aw-rewrite match="^rst_n$" to="rst_ni"></aw-rewrite>
              <aw-rewrite match="^([io]_wb_.+)$" to="${id}_$1"></aw-rewrite>
              <!-- Parent window forwards a full-width offset; child bus is 12-bit. -->
              <aw-rewrite match="^i_wb_adr$" to="${id}_i_wb_adr" width="31:0" part="11:0"></aw-rewrite>
              <aw-connect port="rb_grant_en" to="rg_rb_grant_en"></aw-connect>
              <aw-rewrite match="^o_cs_n$" to="sd${idx}_cs_n"></aw-rewrite>
              <aw-rewrite match="^o_sck$" to="sd${idx}_sck"></aw-rewrite>
              <aw-rewrite match="^o_mosi$" to="sd${idx}_mosi"></aw-rewrite>
              <aw-rewrite match="^i_miso$" to="sd${idx}_miso"></aw-rewrite>
              <aw-rewrite match="^i_cd$" to="sd${idx}_cd"></aw-rewrite>
            </aw-template>
          </aw-templates>
          <aw-insts>
            <aw-inst id="u_rst" mod="soc_reset">
              <aw-template>
                <aw-connect port="i_rst_n" to="rst_ni"></aw-connect>
                <aw-connect port="o_rst" to="rst"></aw-connect>
              </aw-template>
            </aw-inst>

            <aw-inst id="cpu" mod="picorv32_wb" idx="0">
              <aw-template base="wb_mst" inst_name="u_cpu">
                <aw-param name="BARREL_SHIFTER" expr="1"></aw-param>
                <aw-param name="COMPRESSED_ISA" expr="1"></aw-param>
                <aw-param name="ENABLE_MUL" expr="1"></aw-param>
                <aw-param name="ENABLE_DIV" expr="1"></aw-param>
                <aw-param name="ENABLE_IRQ" expr="1"></aw-param>
                <aw-param name="ENABLE_IRQ_QREGS" expr="0"></aw-param>
                <aw-param name="LATCHED_IRQ" expr="32'h00000000"></aw-param>
                <aw-param name="PROGADDR_RESET" expr="32'h01000000"></aw-param>
                <aw-param name="PROGADDR_IRQ" expr="32'h00000000"></aw-param>
                <aw-param name="STACKADDR" expr="32'h00010000"></aw-param>
                <aw-connect port="wb_clk_i" to="clk"></aw-connect>
                <aw-connect port="wb_rst_i" to="rst"></aw-connect>
                <aw-connect port="irq" to="irq_bus" width="31:0"></aw-connect>
                <aw-connect port="eoi" type="open"></aw-connect>
                <aw-connect port="pcpi_valid" type="open"></aw-connect>
                <aw-connect port="pcpi_insn" type="open"></aw-connect>
                <aw-connect port="pcpi_rs1" type="open"></aw-connect>
                <aw-connect port="pcpi_rs2" type="open"></aw-connect>
                <aw-connect port="pcpi_wr" to="1'b0" type="const"></aw-connect>
                <aw-connect port="pcpi_rd" to="32'h00000000" type="const"></aw-connect>
                <aw-connect port="pcpi_wait" to="1'b0" type="const"></aw-connect>
                <aw-connect port="pcpi_ready" to="1'b0" type="const"></aw-connect>
                <aw-connect port="trace_valid" type="open"></aw-connect>
                <aw-connect port="trace_data" type="open"></aw-connect>
                <aw-connect port="mem_instr" type="open"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- CPU + JTAG interconnect + attached smoke_regfile. Cascade slaves ch0/ch1. -->
            <aw-inst id="u_ic" mod="soc_wb_system">
              <aw-template>
                <aw-connect port="rst_n" to="rst_ni"></aw-connect>
                <aw-connect port="rb_grant_en" to="rg_rb_grant_en"></aw-connect>
                <aw-connect port="i_bank_mux_sel" to="rg_bank_sel"></aw-connect>
                <aw-connect port="ro_value" to="rg_cfg"></aw-connect>
                <aw-connect port="dbg_en" to="1'b1" type="const"></aw-connect>
                <aw-connect port="c_rg_sticky_set" to="p_rg_go"></aw-connect>
                <aw-rewrite
                  match="^(rg_enable|rg_mode|rg_capture|c_rg_sticky|o_bank_sel|rg_key_\d)$"
                  type="open"
                ></aw-rewrite>
              </aw-template>
            </aw-inst>

            <!-- DFT placeholder TAP: external jtag_* pins; dbg_* identity-match u_ic. -->
            <aw-inst id="u_tap" mod="demo_tap">
              <aw-template></aw-template>
            </aw-inst>

            <aw-inst id="sram" mod="wb_sram">
              <aw-template base="wb_slv">
                <aw-param name="WORDS" expr="16384"></aw-param>
                <aw-param name="AW" expr="14"></aw-param>
              </aw-template>
            </aw-inst>

            <aw-inst id="flash_xip" mod="wb_spiflash">
              <aw-template base="wb_slv" inst_name="u_flash">
                <aw-rewrite match="^i_cfg_(.+)$" to="flash_cfg_i_wb_$1"></aw-rewrite>
                <aw-rewrite match="^o_cfg_(.+)$" to="flash_cfg_o_wb_$1"></aw-rewrite>
              </aw-template>
            </aw-inst>

            <aw-inst id="uart" mod="wb_uart">
              <aw-template base="wb_slv"></aw-template>
            </aw-inst>

            <aw-inst id="testout" mod="wb_testout">
              <aw-template base="wb_slv">
                <aw-connect port="o_test_valid" to="test_valid"></aw-connect>
                <aw-connect port="o_test_data" to="test_data" packed="auto"></aw-connect>
              </aw-template>
            </aw-inst>

            <aw-inst id="ch0" mod="sd_sha_ch" idx="0">
              <aw-template base="ch">
                <aw-connect port="o_sd_irq" to="irq_srcs" width="5:0" part="0"></aw-connect>
                <aw-connect port="o_dma_irq" to="irq_srcs" width="5:0" part="2"></aw-connect>
                <aw-connect port="o_sha_irq" to="irq_srcs" width="5:0" part="4"></aw-connect>
              </aw-template>
            </aw-inst>
            <aw-inst id="ch1" mod="sd_sha_ch" idx="1">
              <aw-template base="ch">
                <aw-connect port="o_sd_irq" to="irq_srcs" width="5:0" part="1"></aw-connect>
                <aw-connect port="o_dma_irq" to="irq_srcs" width="5:0" part="3"></aw-connect>
                <aw-connect port="o_sha_irq" to="irq_srcs" width="5:0" part="5"></aw-connect>
              </aw-template>
            </aw-inst>

            <aw-inst id="smoke_glue" mod="smoke_wb">
              <aw-template inst_name="u_smoke_glue">
                <aw-connect port="rst_n" to="rst_ni"></aw-connect>
              </aw-template>
            </aw-inst>

            <aw-inst id="u_irq" mod="soc_irqmerge">
              <aw-template>
                <aw-connect port="i_ints" to="irq_srcs" width="5:0"></aw-connect>
                <aw-connect port="o_irq" to="irq_bus" width="31:0"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- Macro-width probe: the macro-width signal passes up through this
                 wrapper and is tied to constant 0 here (stays inside soc_top). -->
            <aw-inst id="u_macro_probe" mod="macro_width_probe">
              <aw-template>
                <aw-connect port="macro_width_signal" to="0" type="const"></aw-connect>
              </aw-template>
            </aw-inst>
          </aw-insts>
        </aw-content>
        <aw-submods></aw-submods>
        <aw-render></aw-render>
      </aw-mod>
    </autowire>
  </body>
</html>
