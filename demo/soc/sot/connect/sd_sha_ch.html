<!doctype html>
<!--
  Connect unit "sd_sha_ch": one SD + DMA + SHA256 channel.
    sdspi + sd_rd_dma (CSR slave "dma" / engine master "eng") + sha256wb
    (AXIS glue + core). sha256_regfile lives inside sd_sha_system.
  One BusDef (sd_sha) is instantiated twice from soc_top (ch0 / ch1).
  Cascade face: sd_sha_system remaps Master("uplink") to i_wb_* / o_wb_*.
  Channel-relative map (parent window 4 KiB at ch0=0x0300_0000 / ch1=0x0300_1000):
    0x00  sd     sdspi
    0x10  dma    sd_rd_dma CSR
    0x40  sha256 sha256_regfile
  DMA SRC is this relative map (parent already strips the window base).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>sd_sha_ch</title>
  </head>
  <body>
    <autowire>
      <aw-mod name="sd_sha_ch">
        <aw-content>
          <aw-imports></aw-imports>
          <aw-params></aw-params>
          <aw-localparams></aw-localparams>
          <aw-ports></aw-ports>
          <aw-templates>
            <aw-template name="wb_mst" inst_name="${id}_${idx}">
              <aw-rewrite match="^wbm_(.+)_o$" to="${id}_o_wb_$1"></aw-rewrite>
              <aw-rewrite match="^wbm_(.+)_i$" to="${id}_i_wb_$1"></aw-rewrite>
            </aw-template>
            <aw-template name="wb_slv" inst_name="u_${id}">
              <aw-rewrite match="^rst_n$" to="rst_ni"></aw-rewrite>
              <aw-rewrite match="^([io]_wb_.+)$" to="${id}_$1"></aw-rewrite>
            </aw-template>
          </aw-templates>
          <aw-insts>
            <!-- Channel interconnect + attached sha256_regfile. Cascade = i_wb_*. -->
            <aw-inst id="u_ic" mod="sd_sha_system">
              <aw-template>
                <aw-connect port="rst_n" to="rst_n"></aw-connect>
                <aw-connect port="rb_grant_en" to="rb_grant_en"></aw-connect>
                <!-- The local DMA engine does not select a shadow bank. -->
                <aw-connect port="eng_o_wb_tga_bank" to="2'd0" type="const"></aw-connect>
              </aw-template>
            </aw-inst>

            <aw-inst id="sd" mod="sdspi">
              <aw-template base="wb_slv" inst_name="u_sd">
                <aw-rewrite match="^i_wb_addr$" to="sd_i_wb_adr" width="11:0" part="3:2"></aw-rewrite>
                <aw-rewrite match="^i_wb_data$" to="sd_i_wb_dat" width="31:0"></aw-rewrite>
                <aw-rewrite match="^o_wb_data$" to="sd_o_wb_dat" width="31:0"></aw-rewrite>
                <aw-rewrite match="^i_wb_sel$" to="sd_i_wb_sel" width="3:0"></aw-rewrite>
                <aw-connect port="i_clk" to="clk"></aw-connect>
                <aw-connect port="i_sd_reset" to="rst"></aw-connect>
                <aw-rewrite match="^o_wb_stall$" type="open"></aw-rewrite>
                <aw-rewrite match="^o_debug$" type="open"></aw-rewrite>
                <aw-connect port="i_bus_grant" to="1'b1" type="const"></aw-connect>
                <aw-connect port="o_cs_n" to="o_cs_n"></aw-connect>
                <aw-connect port="o_sck" to="o_sck"></aw-connect>
                <aw-connect port="o_mosi" to="o_mosi"></aw-connect>
                <aw-connect port="i_miso" to="i_miso"></aw-connect>
                <aw-connect port="i_card_detect" to="i_cd"></aw-connect>
                <aw-connect port="o_int" to="o_sd_irq"></aw-connect>
              </aw-template>
            </aw-inst>

            <!-- Engine master "eng"; CSR slave keeps bus-slave name "dma". -->
            <aw-inst id="eng" mod="sd_rd_dma" idx="0">
              <aw-template base="wb_mst" inst_name="u_dma">
                <!-- Channel fabric address width (sd_sha addrWidth). -->
                <aw-param name="AW" expr="12"></aw-param>
                <aw-param name="SAW" expr="12"></aw-param>
              </aw-template>
              <aw-template base="wb_slv">
                <aw-rewrite match="^([io]_wb_.+)$" to="dma_$1"></aw-rewrite>
                <aw-connect port="o_irq" to="o_dma_irq"></aw-connect>
                <aw-connect port="m_axis_tdata" to="axis_tdata" width="31:0"></aw-connect>
                <aw-connect port="m_axis_tvalid" to="axis_tvalid"></aw-connect>
                <aw-connect port="m_axis_tready" to="axis_tready"></aw-connect>
                <aw-connect port="m_axis_tlast" to="axis_tlast"></aw-connect>
              </aw-template>
            </aw-inst>

            <aw-inst id="sha" mod="sha256wb">
              <aw-template inst_name="u_sha">
                <aw-connect port="s_axis_tdata" to="axis_tdata" width="31:0"></aw-connect>
                <aw-connect port="s_axis_tvalid" to="axis_tvalid"></aw-connect>
                <aw-connect port="s_axis_tready" to="axis_tready"></aw-connect>
                <aw-connect port="s_axis_tlast" to="axis_tlast"></aw-connect>
                <aw-connect port="irq_o" to="o_sha_irq"></aw-connect>
              </aw-template>
            </aw-inst>
          </aw-insts>
        </aw-content>
        <aw-submods></aw-submods>
        <aw-render></aw-render>
      </aw-mod>
    </autowire>
  </body>
</html>
