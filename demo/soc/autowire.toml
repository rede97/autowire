# autowire workspace config (contract: docs/workspace/toml.md)
# SoC demo workspace: picorv32 + simpleuart + spimemio + 2x sdspi +
# 2x read DMA + 2x sha256 (Wishbone + AXI4-Stream).
# Run from this directory: bun ../../index.ts analysis / web soc_top / check

[hdxml]
# hdxml binary path (relative to this file). Unset = default lookup:
# --hdxml CLI > $HDXML_BIN > repo hdxml/target/{release,debug} > PATH

[analysis.rtl]
filelists = ["rtl/soc.f"]
incdirs = []
exclude_filenames = []

[analysis.defines]

[analysis.index]
# RtlIndex XML dir; fixed generated temp dir (deletable)
dir = ".autowire/hdxml"

[dump]
connect_dir = "gen/connect"
sim_dir = "gen/sim"
plugins_dir = "gen/plugins"

# Packed C / Excel / uvm_reg (not SoT)
[plugins.wishbone]
c = "fw/gen/wishbone"
export = "fw/gen/wishbone/wishbone.xlsx"
uvm = "dv/ral"

# Author SoT: sot/connect/*.html + sot/wb_reg_*.ts / sot/wb_bus_*.ts
[wishbone.sha256]
ts = "sot/wb_reg_sha256.ts"
exports = ["sha256"]

[wishbone.smoke]
ts = "sot/wb_reg_smoke.ts"
exports = ["smoke"]

[wishbone.soc]
ts = "sot/wb_bus_soc.ts"
exports = ["soc_wb"]

[style]
# traditional RTL look: aligned declaration/inst ports + params + signals,
# uppercased folding names (param_inline stays at its default true)
port_align = true
param_align = true
inst_port_align = true
inst_param_align = true
signal_align = true
localparam_upper = true

# sha256 Wishbone re-wrap (regs leaf + streaming core)
[connect.sha256wb]
html = "sot/connect/sha256wb.html"

# SoC top: cross-unit reference to sha256wb -> deps
[connect.soc_top]
html = "sot/connect/soc_top.html"
deps = ["sha256wb"]

# DV TB top (aw-tb-mod) — dump → gen/sim/
[sim.soc_tb]
html = "sim/soc_tb.html"
deps = ["soc_top"]
