# autowire workspace config (contract: docs/workspace/toml.md)
# SoC demo workspace: picorv32 + simpleuart + spimemio + 2x sdspi +
# 2x read DMA + 2x sha256 (Wishbone + AXI4-Stream).
# Run from this directory: bun ../../index.ts analysis / web soc_top / check

[workspace]
name = "soc"

[analysis.rtl]
filelists = ["rtl/soc.f"]
incdirs = []
exclude_filenames = []

[analysis]
# Macro header (.svh; not a filelist entry): the macro-width probe leaf's port width.
define_headers = ["rtl/soc_macros.svh"]

[analysis.defines]

# RtlIndex: fixed at .autowire/hdxml (created by init; deletable cache)


[workspace.dump]
connect_dir = "rtl/gen/connect"
sim_dir = "rtl/gen/sim"
plugins_dir = "rtl/gen/plugins"

# Packed C / Excel / uvm_reg / SV sv_reg (not SoT); regfile/ and bus/ stay separate
[plugins.wishbone]
c = "fw/gen/wishbone"
export = "fw/gen/wishbone/bus_regfiles.xlsx"
uvm = "dv/ral"
sv_reg = "dv/sv_reg"

# Author SoT: sot/connect/*.html + sot/wb_reg_*.ts / sot/wb_bus_*.ts
[wishbone.sha256]
ts = "sot/wb_reg_sha256.ts"
exports = ["sha256"]

[wishbone.smoke]
ts = "sot/wb_reg_smoke.ts"
exports = ["smoke"]

[wishbone.soc]
ts = "sot/wb_bus_soc.ts"
exports = ["soc_wb"]

[wishbone.sd_sha]
ts = "sot/wb_bus_sd_sha.ts"
exports = ["sd_sha"]

[workspace.style]
# traditional RTL look: aligned declaration/inst ports + params + signals,
# uppercased folding names (param_inline stays at its default true)
port_align = true
param_align = true
inst_port_align = true
inst_param_align = true
# port-map comments: short direction + port width, e.g. // o [31:0]
inst_port_dir = true
inst_port_dir_format = "short"
inst_port_width = true
signal_align = true
localparam_upper = true

# sha256 Wishbone re-wrap (regs leaf + streaming core)
[connect.sha256wb]
html = "sot/connect/sha256wb.html"

# SD + DMA + SHA256 channel (one BusDef, instantiated twice from soc_top)
[connect.sd_sha_ch]
html = "sot/connect/sd_sha_ch.html"
deps = ["sha256wb"]

# SoC top: cross-unit references to sd_sha_ch + macro_width_probe -> deps
[connect.soc_top]
html = "sot/connect/soc_top.html"
deps = ["sd_sha_ch", "macro_width_probe"]

# Macro-width signal probe (independent connect unit; not wired into soc_top)
[connect.macro_width_probe]
html = "sot/connect/macro_width_probe.html"

# DV TB top (aw-tb-mod) — dump → rtl/gen/sim/
[sim.soc_tb]
html = "sim/soc_tb.html"
deps = ["soc_top"]
